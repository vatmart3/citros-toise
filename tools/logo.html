<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
 html,body{margin:0;width:512px;height:512px}
 body{display:grid;place-items:center;background:#0B1D3A;font-family:"Anton",Impact,sans-serif;color:#F8F6F2}
 .l{display:grid;justify-items:center;gap:18px}
 svg{width:150px;height:150px;color:#F7D04A}
 b{font-size:46px;font-weight:400;letter-spacing:.04em;text-transform:uppercase}
 i{font-family:"Montserrat",sans-serif;font-style:normal;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#ABC7C7}
</style></head><body>
 <div class="l">
  <svg viewBox="0 0 48 48"><use href="#mark-lemon"></use></svg>
  <b>Citrosétoise</b><i>Sète — France</i>
 </div>
<script type="module">
  const html = await (await fetch('/index.html')).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.body.appendChild(doc.querySelector('svg.sprite'));
</script>
</body></html>
